# Public address for Viro Control on the Contabo host's nginx. Install as /etc/nginx/sites-available/control.viro3.online.conf, link it into sites-enabled,
# then run: sudo certbot --nginx -d control.viro3.online   (certbot adds the https certificate and the redirect).
server {
    listen 80;
    listen [::]:80;
    server_name control.viro3.online;

    client_max_body_size 300m;                 # the installer (.msi) is uploaded here

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;       # remote-support sessions use WebSockets
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

