# Serve the Viro WorkCare marketing site on the company's own domain (viro3.online and www.viro3.online).
# Not applied by install.sh: it needs sudo on the host, DNS A records for both names pointing at this server, and a certificate.
#   1. DNS: add A records for viro3.online and www.viro3.online -> 79.143.177.140
#   2. copy this file to /etc/nginx/sites-available/viro-landing and symlink it into sites-enabled
#   3. sudo certbot --nginx -d viro3.online -d www.viro3.online
#   4. sudo nginx -t && sudo systemctl reload nginx
# The console stays on control.viro3.online (nginx-control.conf). The marketing site is served by the same Control app under /site/;
# this file shows it at the root of the company domain.
server {
    listen 80;
    server_name viro3.online www.viro3.online;

    # the home page, and everything else, from the Control app on this host
    location = / { proxy_pass http://127.0.0.1:8090/site/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://127.0.0.1:8090; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }

    # the console is not offered on this name: send people who type a console address to the right place
    location ~ ^/(api|agent)/ { return 301 https://control.viro3.online$request_uri; }
}
