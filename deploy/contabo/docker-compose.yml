# Viro Control on the shared Contabo VPS, next to the other applications already running there.
# - Nothing is published to the internet by this file: the app listens on 127.0.0.1:8090 only, and the host's nginx adds the public https address.
# - The database is private to this stack (no host port) and has its own volume; it never touches the other applications' databases.
# - Container, network and volume names are prefixed viro-control so nothing collides with what is already there.
name: viro-control

services:
  db:
    image: postgres:16-alpine
    container_name: viro-control-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: viro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run install.sh first}
      POSTGRES_DB: viro
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U viro -d viro"], interval: 5s, timeout: 3s, retries: 20 }
    mem_limit: 768m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  app:
    build: ../../server
    image: viro-control-app:latest
    container_name: viro-control-app
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:8090:8080"]
    environment:
      DATABASE_URL: postgres://viro:${POSTGRES_PASSWORD}@db:5432/viro
      JWT_SECRET: ${JWT_SECRET:?run install.sh first}
      PLATFORM_KEY: ${PLATFORM_KEY:?run install.sh first}
      JOB_SIGNING_KEY: ${JOB_SIGNING_KEY:?run install.sh first}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      CERT_SIGNING_KEY_B64: ${CERT_SIGNING_KEY_B64:-}   # Viro certificate signing key (PKCS8 PEM, base64 on one line); without it certificates are refused
      SMTP_URL: ${SMTP_URL:-}                      # Viro's own outgoing mail (certificates); without it certificates are refused
      MAIL_FROM: ${MAIL_FROM:-}
      HELP_INBOX: ${HELP_INBOX:-}                  # where new help requests are announced by email (optional; they are always in the operator console)
      ALERT_EMAIL: ${ALERT_EMAIL:-}                # where "a customer says they have paid" is emailed (falls back to HELP_INBOX)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://control.viro3.online}
      NODE_ENV: production
      RELEASES_DIR: /data/releases
      MOVE_DIR: /data/move                      # Viro Move: encrypted snapshots (the server cannot read them)
      MOVE_BUSINESS_QUOTA_GB: "20"
      REQUIRE_TRUSTED_SIGNATURE: "0"          # the installer is not code-signed yet; turn on once it is
      TRUST_PROXY: "127.0.0.1,::1,172.16.0.0/12"   # the host's nginx (via the Docker bridge) tells us each visitor's real address
      HOST: 0.0.0.0
      PORT: "8080"
    volumes: [releases:/data/releases, move:/data/move]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"], interval: 15s, timeout: 5s, retries: 5, start_period: 20s }
    mem_limit: 1g
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

volumes: { pgdata: {}, releases: {}, move: {} }
