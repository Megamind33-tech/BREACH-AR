# Viro WorkCare marketing site at https://workcare.viro3.online
# The site is served by the Control app (127.0.0.1:8090) under /site/, and the installer under /install/. This name shows the site at its root.
# The console stays on control.viro3.online. Needs sudo on the host; steps are in enable-workcare.sh.
# WARNING: once enable-workcare.sh has run, certbot appends its own `listen 443 ssl` server block (and a port-80
# redirect block) to the DEPLOYED copy at /etc/nginx/sites-available/workcare.viro3.online.conf. This file here is the
# pre-TLS source. Never `cp` it straight over the live file after that point - it will silently delete HTTPS for this
# domain (nginx -t still passes; only a live request fails). To change a location block, edit the live file directly
# or re-run `sudo certbot --nginx -d workcare.viro3.online --redirect --non-interactive --agree-tos -m info@viro3.online`
# right after copying this file in, which re-attaches the existing certificate without issuing a new one.
server {
    server_name workcare.viro3.online;

    # the home page, and the site's own files, from the Control app on this host
    location = / { proxy_pass http://127.0.0.1:8090/site/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /site/ { proxy_pass http://127.0.0.1:8090; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /install/ { proxy_pass http://127.0.0.1:8090; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location ~ ^/(logo\.png|media/|fonts/|hero-video\.js|favicon) { proxy_pass http://127.0.0.1:8090; proxy_set_header Host $host; }
    location = /verify { proxy_pass http://127.0.0.1:8090; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /verify/ { proxy_pass http://127.0.0.1:8090; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }

    # crawlers look for these at the bare domain root, not under /site/
    location = /robots.txt { proxy_pass http://127.0.0.1:8090/site/robots.txt; proxy_set_header Host $host; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8090/site/sitemap.xml; proxy_set_header Host $host; }

    # the console and its API are not offered on this name: anyone who types one is sent to the right place
    location / { return 301 https://control.viro3.online$request_uri; }

    listen 80;
    listen [::]:80;
}
