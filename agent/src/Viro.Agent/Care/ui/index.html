/* Viro WorkCare, Windows app. Flat and quiet: a solid background, solid panels with no borders or glows, one emerald accent, very little text.
   Every tool page: a title row, a few figures, a table or list, one action. Detail appears only when asked for. */
:root{
  --bg:#0b0f0d; --side:#080b0a; --panel:#121916; --raise:#19221e; --hover:#161e1a;
  --line:rgba(255,255,255,.055); --line2:rgba(255,255,255,.12);
  --text:#f1f6f3; --muted:#93a59b; --dim:#68796f;
  --green:#34d27b; --accent:#1f9d62; --accent-h:#25ad6c; --amber:#ffb340; --red:#ff6259; --blue:#4da3ff;
  --r:10px; --font:"Segoe UI Variable Text","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);height:100vh}

/* ---- sidebar ---- */
.side{background:var(--side);display:flex;flex-direction:column;padding:16px 10px 12px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.side::-webkit-scrollbar{width:8px}.side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.mark{width:34px;height:34px;border-radius:9px;background:#fff var(--logo) center/cover no-repeat;flex:none}
.brand b{font-size:15px;font-weight:700;display:block;line-height:1.1}.brand small{color:var(--green);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:650}
.navgroup{margin:14px 0 4px;padding:0 10px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);font-weight:650}
.nav{display:flex;align-items:center;gap:11px;width:100%;height:34px;padding:0 10px;border-radius:7px;color:#b4c5bc;text-align:left;position:relative;font-weight:500}
.nav svg{width:17px;height:17px;flex:none;color:var(--dim)}
.nav:hover{background:rgba(255,255,255,.045);color:#fff}
.nav.on{background:var(--raise);color:#fff}.nav.on svg{color:var(--green)}
.nav.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--green)}
.badge{margin-left:auto;min-width:19px;height:18px;border-radius:9px;padding:0 6px;font-size:11px;font-weight:700;display:grid;place-items:center;background:var(--amber);color:#1b1200}
.spacer{flex:1;min-height:10px}
.device{margin-top:10px;padding:10px 11px;border-radius:9px;background:var(--panel)}
.device .row{display:flex;align-items:center;gap:10px}.avatar{width:30px;height:30px;border-radius:8px;background:var(--raise);display:grid;place-items:center;color:#c9d9d0;flex:none}
.device b{display:block;font-size:12.5px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.device small{color:var(--muted);font-size:11.5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--dim)}.dot.ok{background:var(--green)}.dot.warn{background:var(--amber)}.dot.bad{background:var(--red)}
.adminbtn{margin-top:8px;width:100%;height:30px;border-radius:7px;background:var(--raise);color:#d5e2db;font-size:12px;font-weight:600}.adminbtn:hover{background:#1f2b26}

/* ---- main ---- */
.main{display:flex;flex-direction:column;min-width:0;height:100vh;background:var(--bg)}
.top{display:flex;align-items:flex-end;gap:14px;padding:20px 28px 6px}
.top h1{font-size:21px;font-weight:700;letter-spacing:-.2px;line-height:1.15}.top p{color:var(--muted);margin-top:2px;font-size:12.5px}
.top .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.strip{display:flex;align-items:center;gap:8px;margin:0 28px;padding:6px 0 10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
.strip b{color:var(--text);font-weight:650}.strip i{color:var(--dim);font-style:normal}.strip .sp{flex:1}.strip .t{overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow:auto;padding:14px 28px 28px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.scroll::-webkit-scrollbar{width:10px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px;border:3px solid var(--bg)}
.page{animation:rise .25s ease both}@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- primitives ---- */
.card,.panel{background:var(--panel);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.hero{grid-template-columns:250px minmax(0,1fr)}

.kicker{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);font-weight:650}
.muted{color:var(--muted)}.tight{margin-top:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.btn{height:32px;padding:0 14px;border-radius:7px;font-weight:650;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background .12s}
.btn svg{width:15px;height:15px;stroke-width:2}

.btn.ghost{background:var(--raise);color:#e1ebe5}.btn.ghost:hover{background:#222f29}

.btn[disabled]{opacity:.4;pointer-events:none}

.pill.ok{background:rgba(52,210,123,.13);color:#5fe69b}.pill.warn{background:rgba(255,179,64,.13);color:#ffc668}.pill.bad{background:rgba(255,98,89,.14);color:#ff8a82}.pill.info{background:rgba(77,163,255,.13);color:#7db9ff}.pill.na{background:rgba(255,255,255,.06);color:#aebfb6}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;background:var(--green);transition:width .7s ease}.bar.amber i{background:var(--amber)}.bar.red i{background:var(--red)}

/* ---- health ring ---- */
.ring{position:relative;width:116px;height:116px;margin:4px auto 2px}.ring svg{transform:rotate(-90deg)}.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}

.ring circle{fill:none;stroke-width:9;stroke-linecap:round}.ring .bg{stroke:rgba(255,255,255,.08)}.ring .fg{transition:stroke-dashoffset .9s ease}

/* ---- overview ---- */
.healthcard{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px}
.healthcard .st{font-weight:650;margin-top:6px}
.vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0}
.vital{padding:16px 18px;min-width:0}.vital+.vital{border-left:1px solid var(--line)}
.vital .k{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}.vital .k svg{width:15px;height:15px;color:var(--green)}
.vital .v{font-size:27px;font-weight:700;letter-spacing:-.7px;margin:7px 0 9px;line-height:1}.vital .v small{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:3px}
.vital .c{color:var(--muted);font-size:12px;margin-top:8px;display:flex;justify-content:space-between;gap:8px}.vital .c a{color:var(--green);font-weight:650;cursor:pointer;white-space:nowrap}.vital .c a:hover{text-decoration:underline}
.vitals .foot{grid-column:1/-1;padding:10px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}.vitals .foot b{color:var(--text);font-weight:600}
.head2{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 2px 8px}
.tabs{display:flex;gap:2px}.tabs button{height:24px;padding:0 10px;border-radius:6px;color:var(--muted);font-size:12px;font-weight:600}.tabs button.on{background:var(--raise);color:#fff}
.issues{background:var(--panel);border-radius:var(--r);overflow:hidden}
.issue{display:grid;grid-template-columns:8px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:0 14px;min-height:46px;border-bottom:1px solid var(--line);cursor:pointer}.issue:last-child{border-bottom:0}
.issue:hover{background:var(--hover)}
.issue .sev{width:8px;height:8px;border-radius:50%;background:var(--dim)}.issue.high .sev{background:var(--red)}.issue.medium .sev{background:var(--amber)}.issue.low .sev{background:var(--blue)}
.issue b{font-weight:600}.issue .tag{color:var(--dim);font-size:12px}
.issue .more{grid-column:2/-1;color:var(--muted);font-size:12.5px;line-height:1.5;padding:0 0 12px;display:none}.issue.open .more{display:block}
.issue>div:last-child{padding:8px 0}

/* ---- tool page template ---- */
.sum{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-bottom:12px}
.sum .s{background:var(--panel);border-radius:var(--r);padding:12px 16px;min-width:0}
.sum .k{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);font-weight:650;display:block}.sum b{display:block;font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px;line-height:1.15}.sum small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sum .s.warn b{color:var(--amber)}.sum .s.bad b{color:var(--red)}.sum .s.ok b{color:var(--green)}.sum .bar{margin-top:8px}
.panel{padding:0;overflow:hidden}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}.panel>header p{color:var(--muted);font-size:12px;margin-top:1px}.panel>header .tb{display:flex;gap:8px;align-items:center}
.ctl{display:flex;align-items:center;gap:13px;padding:0 16px;min-height:44px;border-top:1px solid var(--line)}
.ctl[data-cat],.ctl[data-h]{cursor:pointer}.ctl[data-cat]:hover,.ctl[data-h]:hover{background:var(--hover)}
.ctl b{font-weight:600;display:block}.ctl small{color:var(--muted);font-size:12px;display:block}.ctl .grow{flex:1;min-width:0}.ctl .sz{width:90px;text-align:right}.ctl .sz b{font-weight:600}
.padb{padding:12px 16px;border-top:1px solid var(--line)}
.actionbar{position:sticky;bottom:-28px;margin:14px -28px -28px;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--bg);border-top:1px solid var(--line);z-index:5}
.actionbar .in{flex:1;display:flex;align-items:center;justify-content:space-between;gap:14px}
.actionbar .l{color:var(--muted);font-size:12.5px}.actionbar .l b{color:#fff}.actionbar .r{display:flex;gap:8px}
.sw{position:relative;width:36px;height:20px;border-radius:10px;background:#323f38;flex:none;transition:background .15s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(16px)}.sw.busy{opacity:.5;pointer-events:none}
.check{width:18px;height:18px;border-radius:5px;border:1.5px solid rgba(255,255,255,.26);display:grid;place-items:center;flex:none}.check svg{width:12px;height:12px;color:#04170d;opacity:0}.check.on{background:var(--green);border-color:var(--green)}.check.on svg{opacity:1}
table{width:100%;border-collapse:collapse}th{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);font-weight:650;text-align:left;padding:8px 16px;border-top:1px solid var(--line)}td{padding:0 16px;height:44px;border-top:1px solid var(--line);vertical-align:middle}
.tl{position:relative;padding-left:22px}.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line2)}.ev{position:relative;padding:0 0 14px}.ev::before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--panel)}.ev small{color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:7px;height:90px}.chart div{flex:1;border-radius:4px 4px 1px 1px;background:var(--accent);position:relative;min-height:4px;transition:height .7s ease}.chart div.hi{background:var(--amber)}.chart small{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--muted)}
.mini{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:12px;align-items:center;font-size:12.5px;padding:0 16px;min-height:38px;border-top:1px solid var(--line)}.mini b{text-align:right}

/* ---- feedback ---- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;display:flex;flex-direction:column;gap:8px;align-items:center;z-index:50}
.toast{display:flex;align-items:center;gap:10px;padding:10px 15px;border-radius:9px;background:#1d2823;max-width:520px;animation:pop .25s ease both}.toast.ok{border-left:3px solid var(--green)}.toast.bad{border-left:3px solid var(--red)}.toast a{color:var(--green);cursor:pointer;font-weight:650;margin-left:6px}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;background:rgba(4,7,5,.7);display:grid;place-items:center;z-index:60;animation:fade .15s both}@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(420px,92vw);background:#151d19;border-radius:12px;padding:20px}.modal h2{font-size:16px;margin-bottom:8px}.modal p{color:#c3d1ca;line-height:1.55}.modal .row{justify-content:flex-end;margin-top:18px}
.skel{border-radius:10px;background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.07),rgba(255,255,255,.03));background-size:200% 100%;animation:sh 1.3s infinite}@keyframes sh{to{background-position:-200% 0}}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:rot .7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}.empty svg{width:34px;height:34px;color:var(--green);margin-bottom:8px}.empty b{display:block;color:var(--text);font-size:14.5px;margin-bottom:3px}
.note{display:flex;gap:10px;padding:11px 14px;border-radius:9px;background:var(--panel);color:#c3d1ca;font-size:12.5px;line-height:1.5}.note svg{width:16px;height:16px;flex:none;color:var(--blue);margin-top:1px}
.scanning{display:flex;align-items:center;gap:12px;padding:24px 18px;color:var(--muted)}
.stat{display:flex;gap:12px;align-items:center;min-width:0}.stat .ic{width:36px;height:36px;border-radius:9px;background:var(--raise);display:grid;place-items:center;color:var(--green);flex:none}.stat .ic svg{width:18px;height:18px}.stat b{font-size:16px;font-weight:700;display:block;line-height:1.15}.stat span{color:var(--muted);font-size:12px;display:block}
.card.page{margin-bottom:12px}
input,textarea{font:inherit}
@media (max-width:1120px){.hero{grid-template-columns:224px minmax(0,1fr)}.vital{padding:14px 12px}.vital .v{font-size:23px}.vital .c{flex-wrap:wrap;gap:2px 8px}.top,.scroll{padding-left:20px;padding-right:20px}.strip{margin:0 20px}.actionbar{margin:14px -20px -28px;padding:12px 20px}}
@media (max-width:900px){.hero,.g3,.g2{grid-template-columns:minmax(0,1fr)}.vitals{grid-template-columns:minmax(0,1fr)}.vital+.vital{border-left:0;border-top:1px solid var(--line)}.issue{grid-template-columns:8px minmax(0,1fr) auto}.issue .tag{display:none}}
@media (max-width:760px){.sum{grid-auto-flow:row}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark"></div><div><b>Viro</b><small>WorkCare</small></div></div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <div class="device" id="device"></div>
  </aside>
  <main class="main"><div class="top" id="top"></div><div class="strip" id="strip"></div><div class="scroll" id="view"></div></main>
</div>
<div class="toasts" id="toasts"></div>
<script>
'use strict';
/* ---------- icons (one stroke style, drawn in the current text colour) ---------- */
const I = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  shield:'<path d="M12 3l7.5 3v5.5c0 4.6-3.1 8.2-7.5 9.5-4.4-1.3-7.5-4.9-7.5-9.5V6L12 3z"/><path d="M8.5 12l2.4 2.4 4.6-4.8"/>',
  gauge:'<path d="M12 14l4-5"/><path d="M3.5 17a9 9 0 1117 0"/><circle cx="12" cy="14" r="1.2"/>',
  refresh:'<path d="M21 12a9 9 0 10-3 6.7"/><path d="M21 4v5h-5"/>',
  broom:'<path d="M3 21l6-6"/><path d="M14 4l6 6-8 8-6-6z"/><path d="M12 6l6 6"/>',
  rocket:'<path d="M5 15c-1.5 1.3-2 5-2 5s3.7-.5 5-2"/><path d="M12 15l-3-3a22 22 0 012-4 12 12 0 0111-5c0 3-1 8-5 11a22 22 0 01-4 2z"/><circle cx="15" cy="9" r="1.2"/>',
  chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>',
  update:'<path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/>',
  temp:'<path d="M14 14.8V5a2 2 0 00-4 0v9.8a4 4 0 104 0z"/>',
  battery:'<rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2"/><path d="M6 10v4M10 10v4"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  alert:'<path d="M12 4l9.5 16h-19L12 4z"/><path d="M12 10v4.5M12 17.5v.1"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.1"/>',
  laptop:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  bolt:'<path d="M13 3L5 13.5h6L10 21l8-10.5h-6L13 3z"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 118 0v3"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 00-5 5L3 18l3 3 6.7-6.7a4 4 0 005-5l-2.7 2.7-2.3-2.3 2.7-2.7z"/>',
  link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
  power:'<path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1011.4 0"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  disk:'<rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M3 14l2.2-7.5A2 2 0 017.1 5h9.8a2 2 0 011.9 1.5L21 14"/><path d="M7 17h.01"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'
};
const ic = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n] || ''}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const gb = b => b >= 1073741824 ? (b / 1073741824).toFixed(1) + ' GB' : Math.round(b / 1048576) + ' MB';
const dur = s => s == null ? '—' : s >= 120 ? `${Math.floor(s / 60)} min ${Math.round(s % 60)} s` : `${Math.round(s)} s`;
const fmtS = dur;
const agoText = iso => { const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000)); return m < 2 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const upText = s => s == null ? '' : s >= 86400 ? `${Math.floor(s / 86400)} d ${Math.floor(s % 86400 / 3600)} h` : s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.floor(s % 3600 / 60)} min` : `${Math.max(1, Math.floor(s / 60))} min`;

/* ---------- bridge to the program ---------- */
const pending = new Map(); let seq = 0;
if (window.chrome?.webview) chrome.webview.addEventListener('message', e => { try { const m = JSON.parse(e.data); const p = pending.get(String(m.id)); if (p) { pending.delete(String(m.id)); m.ok ? (m.data && m.data.locked ? p.rej(Object.assign(new Error('locked'), { locked: true, feature: m.data.feature, title: m.data.title })) : p.res(m.data)) : p.rej(new Error(m.error)); } } catch { } });
const call = (cmd, args = {}) => new Promise((res, rej) => { if (!window.chrome?.webview) return rej(new Error('This page needs the Viro program.')); const id = String(++seq); pending.set(id, { res, rej }); chrome.webview.postMessage(JSON.stringify({ id, cmd, args })); setTimeout(() => { if (pending.delete(id)) rej(new Error('That took too long.')); }, 15 * 60 * 1000); });

/* ---------- feedback ---------- */
function toast(msg, kind = 'ok', undo) {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.innerHTML = `<span style="color:var(--${kind === 'ok' ? 'green' : 'red'})">${ic(kind === 'ok' ? 'check' : 'alert', 17)}</span><div>${esc(msg)}${undo ? '<a>Undo</a>' : ''}</div>`;
  if (undo) $('a', t).onclick = () => { t.remove(); undo(); };
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), undo ? 12000 : 6500);
}
function modal(title, body, ok = 'Continue', danger = false) {
  return new Promise(res => {
    const s = document.createElement('div'); s.className = 'scrim';
    s.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${body}</p><div class="row"><button class="btn ghost" data-n>Cancel</button><button class="btn primary" data-y>${esc(ok)}</button></div></div>`;
    const done = v => { s.remove(); res(v); }; $('[data-n]', s).onclick = () => done(false); $('[data-y]', s).onclick = () => done(true); s.onclick = e => { if (e.target === s) done(false); }; document.body.appendChild(s); $('[data-y]', s).focus();
  });
}
async function busy(btn, label, fn) {
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${esc(label)}`;
  try { return await fn(); } catch (e) { if (e.locked) upgradeModal(e); else toast(e.message, 'bad'); } finally { btn.disabled = false; btn.innerHTML = old; }
}

/* ---------- what is free and what a plan adds ---------- */
const upgradeCard = e => `<div class="page"><div class="panel"><div class="body"><div class="empty" style="padding:44px 20px">${ic('lock', 30)}<b style="font-size:19px">${esc(e.title || 'This is part of Viro Care')}</b>
  <div class="sub" style="max-width:480px;margin:6px auto 18px">Cleaning, start-up, memory and the full scan are free. This one is part of a paid plan, because it goes beyond what free tools do: it finds the real cause, fixes it, checks the fix and lets you undo it.</div>
  <div class="row" style="justify-content:center"><button class="btn primary" data-plans>See plans</button><button class="btn ghost" data-signin>I already have a plan: sign in</button></div></div></div></div></div>`;

async function runRecipe(btn, label, recipe, ok) {

/* ---------- repair programs ---------- */
RENDER.apps = async () => {
  head(); $('#view').innerHTML = scanning('refresh', 'Listing programs…', '');
  const { apps, crashes } = await call('apps.list'); let q = '';
  const repairable = a => a.kind === 'msi' || a.kind === 'appx' || /microsoft (365|office)/i.test(a.name);
  async function repair(a, btn) {
    const office = /microsoft (365|office)/i.test(a.name) && a.kind !== 'appx';
    if (!await modal('Repair ' + a.name + '?', 'Windows will check the program and restore any damaged or missing program files. Your documents and settings are not touched. Close the program first; this can take several minutes.', 'Repair')) return;
    await busy(btn, 'Repairing', async () => {
      const r = office ? await call('recipe.run', { recipe: 'office.quick-repair' }) : await call('apps.repair', { kind: a.kind, id: a.id });
      if (r.needsAdmin) { if (await modal('Administrator rights needed', 'Repairing this program needs an administrator. Viro can reopen with the rights it needs; you will see one Windows prompt.', 'Reopen as administrator')) call('elevate'); return; }
      toast(r.verified ? `${a.name} was repaired and Windows confirms it is healthy.${r.rebootRequired ? ' Restart the PC to finish.' : ''}` : r.summary, r.verified ? 'ok' : 'bad');
    });
  }
  const draw = () => {
    const list = apps.filter(a => !q || a.name.toLowerCase().includes(q)), nRep = apps.filter(repairable).length;
    $('#view').innerHTML = `<div class="page">${sum([{ k: 'Programs', v: apps.length }, { k: 'Repairable', v: nRep }, { k: 'Crashed this week', v: crashes.length, tone: crashes.length ? 'warn' : 'ok' }])}` +
      (crashes.length ? `<div style="margin-bottom:12px">${panel('Crashed or froze this week', '', '', crashes.slice(0, 6).map(c => `<div class="ctl"><div class="grow"><b>${esc(c.exe)}</b><small>${c.crashes ? c.crashes + ' crash' + (c.crashes > 1 ? 'es' : '') : ''}${c.crashes && c.hangs ? ', ' : ''}${c.hangs ? c.hangs + ' freeze' + (c.hangs > 1 ? 's' : '') : ''}</small></div>${c.app && apps.find(a => a.name === c.app && repairable(a)) ? `<button class="btn sm primary" data-fix="${esc(c.app)}">Repair</button>` : '<span class="pill na">No repair</span>'}</div>`).join(''))}</div>` : '') +
      panel('All programs', '', `<input id="q" placeholder="Search" value="${esc(q)}" style="height:28px;border-radius:7px;border:0;background:var(--raise);color:#fff;padding:0 12px;width:200px;user-select:text">`, list.slice(0, 120).map(a => `<div class="ctl"><div class="grow"><b>${esc(a.name)}</b></div><small style="width:120px">${esc(a.version || '')}</small>${repairable(a) ? `<button class="btn sm ghost" data-rep="${apps.indexOf(a)}">Repair</button>` : '<span class="pill na" style="width:74px;justify-content:center">No repair</span>'}</div>`).join('') + (list.length ? '' : '<div class="padb muted">No match.</div>') + (list.length > 120 ? `<div class="padb muted">Showing 120 of ${list.length}. Search to narrow.</div>` : '')) + `</div>`;
    $('#q').oninput = e => { q = e.target.value.toLowerCase(); const p = e.target.selectionStart; draw(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
    $$('[data-rep]').forEach(b => b.onclick = () => repair(apps[+b.dataset.rep], b));
    $$('[data-fix]').forEach(b => b.onclick = () => repair(apps.find(a => a.name === b.dataset.fix), b));
  }; draw();
};

/* ---------- crashes and freezes ---------- */
RENDER.stability = async () => {
  head(); $('#view').innerHTML = scanning('refresh', 'Reading what Windows recorded…', '');
  const a = await call('stability.analyze'); const sel = new Set();
  const conf = { high: ['bad', 'Very likely'], medium: ['warn', 'Likely'], low: ['na', 'Note'] };
  const draw = () => {
    $('#view').innerHTML = `<div class="page">${sum([
      { k: 'Blue screens', v: a.blueScreens, tone: a.blueScreens ? 'bad' : 'ok' }, { k: 'Unexpected restarts', v: a.restarts, tone: a.restarts ? 'warn' : 'ok' },
      { k: 'Frozen or crashed', v: a.freezes, tone: a.freezes + a.shellCrashes ? 'warn' : 'ok' }])}
    ${panel('Most likely causes', '', '', a.causes.length ? a.causes.map((c, i) => `<div class="ctl" title="${esc(c.detail)}"><div class="grow"><b>${esc(c.title)}</b></div><span class="pill ${conf[c.confidence][0]}">${conf[c.confidence][1]}</span>${c.recipe ? `<button class="btn sm primary" data-r="${i}">${esc(c.recipeLabel)}</button>` : ''}</div>`).join('') : '<div class="padb muted">Nothing recorded points to a cause.</div>')}
    ${a.codes.length ? `<div style="margin-top:12px">${panel('Blue screen codes', '', '', a.codes.map(c => `<div class="ctl" title="${esc(c.meaning)}"><div class="grow"><b>${esc(c.code)}</b></div><span class="pill na">${c.times}×</span></div>`).join(''))}</div>` : ''}
    <div style="margin-top:12px">${panel('Not responding now', '', '', a.hung.length ? a.hung.map(h => `<div class="ctl" data-h="${h.pid}"><span class="check ${sel.has(h.pid) ? 'on' : ''}">${ic('check', 12)}</span><div class="grow"><b>${esc(h.name)}</b><small>${esc(h.title || '')}</small></div></div>`).join('') : '<div class="padb muted">Everything is answering.</div>')}</div>
    ${a.hung.length ? actionbar(sel.size ? `<b>${sel.size}</b> selected` : 'Tick the programs to close', `<button class="btn primary lg" id="endh" ${sel.size ? '' : 'disabled'}>Close ${sel.size || ''} program${sel.size === 1 ? '' : 's'}</button>`) : ''}</div>`;
    $$('[data-r]').forEach(b => b.onclick = async () => {
      const c = a.causes[+b.dataset.r];
      const ask = { 'shell.repair': 'This resets the icon and thumbnail caches, re-registers the Start menu and search, and restarts Explorer. Open folder windows close; your files are not touched.', 'windows.memory-test': 'Windows will test the memory the next time the PC restarts. It takes 10 to 20 minutes, then Windows starts normally. You can cancel it from Undo changes.', 'power.fast-startup-off': 'Shutting down will then fully close Windows each time. Start-up can be a little slower on a mechanical drive. You can undo this.' }[c.Recipe || c.recipe];
      if (ask && !await modal(c.RecipeLabel || c.recipeLabel, ask, 'Continue')) return;
      const r = await runRecipe(b, 'Working', c.Recipe || c.recipe, 'Done and checked by Windows.'); if (r?.rebootRequired) toast('Restart the PC to finish.');
    });
    $$('[data-h]').forEach(r => r.onclick = () => { const p = +r.dataset.h; sel.has(p) ? sel.delete(p) : sel.add(p); draw(); });
    $('#endh')?.addEventListener('click', e => busy(e.currentTarget, 'Closing', async () => { const r = await call('hung.end', { pids: [...sel] }); toast(r.verified ? 'Closed.' : r.summary, r.verified ? 'ok' : 'bad'); RENDER.stability(); }));
  }; draw();

RENDER.swupdates = async () => {
  head(); $('#view').innerHTML = scanning('refresh', 'Checking for newer versions…', '');
  const r = await call('updates.apps');
  if (!r.available) { $('#view').innerHTML = `<div class="page">${note('Windows Package Manager (winget) is not available on this PC. Install <b>App Installer</b> from the Microsoft Store.')}</div>`; return; }
  const items = r.items; let running = false;
  async function update(u, btn) {
    return busy(btn, 'Updating', async () => {
      const x = await call('updates.app', { id: u.id });
      if (x.needsAdmin) { if (await modal('Administrator rights needed', 'This update needs an administrator. Viro can reopen with the rights it needs; you will see one Windows prompt.', 'Reopen as administrator')) call('elevate'); return false; }
      toast(x.verified ? `${u.name} is now up to date.${x.rebootRequired ? ' Restart to finish.' : ''}` : x.summary, x.verified ? 'ok' : 'bad'); return x.verified;
    });

    $('#view').innerHTML = `<div class="page">${panel(items.length ? `${items.length} can be updated` : 'Everything is up to date', '', items.length ? `<button class="btn primary sm" id="all">${ic('update')}Update all</button>` : '', items.map((u, i) => `<div class="ctl"><div class="grow"><b>${esc(u.name)}</b></div><small style="width:210px">${esc(u.version)} → ${esc(u.available)}</small><button class="btn sm ghost" data-u="${i}">Update</button></div>`).join('') || `<div class="empty">${ic('check')}<b>Nothing to update</b></div>`)}</div>`;
    $$('[data-u]').forEach(b => b.onclick = async () => { if (running) return; running = true; const ok = await update(items[+b.dataset.u], b); running = false; if (ok) { items.splice(+b.dataset.u, 1); draw(); } });

/* ---------- installed programs: sizes and removal ---------- */
RENDER.installed = async () => {
  head(`<button class="btn ghost" id="rs">${ic('refresh')}Scan again</button>`); $('#rs').onclick = () => RENDER.installed();
  $('#view').innerHTML = scanning('trash', 'Measuring installed programs…', 'Sizing every program. This can take up to half a minute.');
  const r = await call('apps.inventory');
  let apps = r.apps, filter = 'all', q = '', banner = null, busyNow = false;
  const maxSize = () => Math.max(1, ...apps.map(a => a.sizeBytes || 0));
  const KIND = { msi: 'Windows Installer', other: 'Program', appx: 'Store app' };

  async function remove(a, btn) {
    if (busyNow) return; busyNow = true;
    const sz = a.sizeBytes ? ` It uses ${gb(a.sizeBytes)}.` : '';
    try {
      if (!await modal(`Uninstall ${a.name}?`, `Windows' own uninstaller for <b>${esc(a.name)}</b> will run.${sz} Afterwards Viro checks it is really gone.`, 'Uninstall', true)) return;
      let x = await busy(btn, 'Uninstalling', () => call('apps.uninstall', { kind: a.kind, id: a.id, hive: a.hive }));
      if (!x) return;
      if (x.needsAdmin) { if (await modal('Administrator rights needed', 'Removing this program needs an administrator. Viro can reopen with the rights it needs; you will see one Windows prompt.', 'Reopen as administrator')) call('elevate'); return; }
      if (!x.verified && x.canForce && a.kind !== 'appx') {
        const go = await modal('The uninstaller could not remove it', `${esc(x.summary)}<br><br><b>Remove it by force?</b> Viro will close the program, move its folder aside (not delete it) and remove its entry from the Installed apps list. The whole forced removal can be undone from <b>Undo changes</b>.`, 'Remove by force', true);
        if (!go) { banner = { bad: true, title: `${a.name} was not removed`, detail: x.summary }; return draw(); }
        x = await busy(btn, 'Removing by force', () => call('apps.uninstall', { kind: a.kind, id: a.id, hive: a.hive, forced: true }));
        if (x?.needsAdmin) { if (await modal('Administrator rights needed', 'Forced removal needs an administrator.', 'Reopen as administrator')) call('elevate'); return; }
      }
      if (x?.verified) {
        const fresh = await call('apps.inventory'); const still = fresh.apps.some(n => n.id === a.id && n.hive === a.hive);      // scan again: it must really be gone
        apps = fresh.apps;
        banner = still ? { bad: true, title: `${a.name} still appears after removal`, detail: 'Windows still lists it. Scan again, or restart the PC and check.' } : { title: `${a.name} was removed`, detail: `Checked again afterwards: it is no longer installed.${sz ? ` About ${gb(a.sizeBytes)} freed.` : ''}${x.rebootRequired ? ' Restart to finish.' : ''}${x.undoable ? ' Forced removal can be undone from Undo changes.' : ''}` };
      } else banner = { bad: true, title: `${a.name} was not removed`, detail: x?.summary || 'Nothing changed.' };
      draw();
    } finally { busyNow = false; }
  }

  const draw = () => {
    const list = apps.filter(a => (filter === 'hidden' ? a.hidden : filter === 'all' ? !a.hidden : true) && a.name.toLowerCase().includes(q.toLowerCase()));
    const hiddenCount = apps.filter(a => a.hidden).length, big = apps.filter(a => (a.sizeBytes || 0) > 1e9).length;
    const m = maxSize();
    const rows = list.map((a, i) => `<div class="ctl"><div class="grow"><b>${esc(a.name)}</b><div class="sub">${esc([a.publisher, a.version, KIND[a.kind]].filter(Boolean).join(' · '))}${a.hidden ? ` · ${esc(a.hiddenReason || 'Hidden')}` : ''}</div></div>
      ${a.hidden ? '<span class="pill na">Hidden</span>' : ''}${a.protectedReason ? `<span class="pill info" title="${esc(a.protectedReason)}">Protected</span>` : ''}
      <div style="width:150px;text-align:right"><b style="color:#fff">${a.sizeBytes ? gb(a.sizeBytes) : '—'}</b><div class="bar" style="margin-top:5px"><i style="width:${a.sizeBytes ? Math.max(2, Math.round(a.sizeBytes / m * 100)) : 0}%"></i></div></div>
      <button class="btn ghost sm" data-rm="${i}" ${a.protectedReason ? 'disabled' : ''}>${ic('trash', 15)}Uninstall</button></div>`).join('');
    const bn = banner ? `<div class="card" style="margin-bottom:12px"><div class="row"><span style="color:var(--${banner.bad ? 'red' : 'green'})">${ic(banner.bad ? 'alert' : 'check', 20)}</span><div><b style="color:#fff">${esc(banner.title)}</b><div class="sub">${esc(banner.detail)}</div></div></div></div>` : '';
    $('#view').innerHTML = `<div class="page">${bn}${sum([{ k: 'Programs', v: apps.filter(a => !a.hidden).length }, { k: 'Space used', v: gb(r.totalBytes || 0) }, { k: 'Over 1 GB each', v: big }, { k: 'Hidden', v: hiddenCount }])}
      ${panel(filter === 'hidden' ? 'Hidden programs' : 'Installed programs', 'Largest first. Uninstalling runs the program\'s own uninstaller and then checks it is gone.',
        `<input id="q" placeholder="Search" value="${esc(q)}" style="height:32px;width:170px;border-radius:8px;border:0;background:var(--bg);color:#fff;padding:0 10px;font:inherit"><button class="btn ${filter === 'all' ? 'primary' : 'ghost'} sm" data-f="all">All</button><button class="btn ${filter === 'hidden' ? 'primary' : 'ghost'} sm" data-f="hidden">Hidden</button>`,
        rows || `<div class="empty">${ic('search')}<b>No programs match</b></div>`)}</div>`;
    $$('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; draw(); });
    $('#q').oninput = e => { q = e.target.value; draw(); $('#q').focus(); $('#q').setSelectionRange(q.length, q.length); };
    $$('[data-rm]').forEach(b => b.onclick = () => remove(list[+b.dataset.rm], b));
    animateBars();
  };
  draw();
};

/* ---------- free space ---------- */
RENDER.space = async (done) => {
  head(`<button class="btn ghost" id="rs">${ic('refresh')}Scan again</button>`); $('#rs').onclick = () => RENDER.space();
  const banner = done ? `<div class="card" style="margin-bottom:12px"><div class="row"><span style="color:var(--${done.bad ? 'red' : 'green'})">${ic(done.bad ? 'alert' : 'check', 20)}</span><div><b style="color:#fff">${esc(done.title)}</b><div class="sub">${esc(done.detail)}</div></div></div></div>` : '';
  $('#view').innerHTML = banner + scanning('broom', 'Measuring what can be cleared…', '');
  const [cats, disk] = await Promise.all([call('space.preview'), call('disk')]);
  const safe = cats.filter(c => c.class === 'SAFE'), safeNow = safe.reduce((n, c) => n + c.bytesFound, 0), recent = cats.find(c => c.id === 'recent-temp')?.bytesFound || 0;
  const sel = new Set(cats.filter(c => c.bytesFound > 0 && c.id !== 'windows-old' && c.id !== 'recycle-bin').map(c => c.id));      // everything Viro can clear is ticked; the Recycle Bin is the person's own choice
  const usedPct = Math.round((disk.totalBytes - disk.freeBytes) / disk.totalBytes * 100);
  const draw = () => {
    const total = cats.filter(c => sel.has(c.id)).reduce((n, c) => n + c.bytesFound, 0);
    $('#view').innerHTML = banner + `<div class="page">${sum([
      { k: `Free on ${esc(disk.drive)}`, v: gb(disk.freeBytes), bar: usedPct, barTone: usedPct > 90 ? 'red' : usedPct > 80 ? 'amber' : '' },
      { k: 'Safe to remove', v: gb(safeNow) }, { k: 'Needs your OK', v: gb(recent), tone: recent > 5e8 ? 'warn' : '' }])}
      ${panel('Select what to remove', 'Your own files are never touched.', `<button class="btn ghost sm" id="allsafe">Select all safe</button>`,
        cats.filter(c => c.id !== 'windows-old').sort((a, b) => (a.class === 'REVIEW') - (b.class === 'REVIEW') || b.bytesFound - a.bytesFound).map(c => `<div class="ctl" data-cat="${esc(c.id)}" title="${esc(c.note || '')}"><span class="check ${sel.has(c.id) ? 'on' : ''}">${ic('check', 12)}</span><div class="grow"><b>${esc(c.title)}</b></div>${c.class === 'REVIEW' ? '<span class="pill warn">Asks first</span>' : ''}<div class="sz"><b>${gb(c.bytesFound)}</b></div></div>`).join(''))}
      ${actionbar(sel.size ? `<b>${sel.size}</b> selected · <b>${gb(total)}</b>` : 'Nothing selected', `<button class="btn primary lg" id="go" ${sel.size && total > 0 ? '' : 'disabled'}>${total > 0 ? 'Free up ' + gb(total) : 'Nothing to free'}</button>`)}</div>`;
    $$('[data-cat]').forEach(r => r.onclick = () => { const id = r.dataset.cat; sel.has(id) ? sel.delete(id) : sel.add(id); draw(); });
    $('#allsafe').onclick = () => { cats.filter(c => c.class === 'SAFE' && c.bytesFound > 0).forEach(c => sel.add(c.id)); draw(); };
    $('#go').onclick = async e => {
      const review = cats.filter(c => sel.has(c.id) && c.class === 'REVIEW');
      if (review.length && !(await modal('Remove these too?', `${review.map(c => `<b>${esc(c.title)}</b> (${gb(c.bytesFound)})`).join('<br>')}<br><br>Files a program is using, or that changed in the last hour, are skipped. Removed files do not go to the Recycle Bin.`, 'Remove'))) return;
      const before = disk.freeBytes;
      await busy(e.currentTarget, 'Removing files', async () => {
        const r = await call('space.clean', { ids: [...sel] });
        const after = (await call('disk')).freeBytes, gained = after - before;
        const real = r.freedBytes > 0 || gained > 0;
        RENDER.space({ bad: !real, title: real ? `Freed ${gb(Math.max(r.freedBytes, gained))}` : 'Nothing could be removed', detail: `${r.filesRemoved.toLocaleString()} files removed. ${disk.drive} now has ${gb(after)} free (was ${gb(before)}).${r.skipped ? ` ${r.skipped.toLocaleString()} in use, left alone.` : ''}${!real && !S.env?.admin ? ' Some locations need Run as administrator.' : ''}` });
      });
    };
  }; draw();
};

    ${panel('Programs', '', '', `<table><thead><tr><th>Name</th><th>Advice</th><th style="width:70px">Starts</th></tr></thead><tbody>${items.map((i, n) => { const a = adv[i.cls] || adv.ASK; return `<tr title="${esc(i.command || '')}"><td><b style="font-weight:600">${esc(i.name)}</b></td><td><span class="pill ${a[0]}" title="${esc(i.reason || '')}">${a[1]}</span></td><td><button class="sw ${i.enabled ? 'on' : ''}" data-i="${n}" aria-label="Start ${esc(i.name)} with Windows" role="switch" aria-checked="${i.enabled}"></button></td></tr>`; }).join('')}</tbody></table>`)}
    ${actionbar(safeOn.length ? `<b>${safeOn.length}</b> safe to stop` : 'Nothing safe left to stop', `<button class="btn primary lg" id="so" ${safeOn.length ? '' : 'disabled'}>Stop the safe ones</button>`)}</div>`;
  const toggle = async (list, enable) => { const r = await call('startup.set', { entries: list.map(i => ({ location: i.location, name: i.name })), enable }); if (!r.verified) { toast(r.needsAdmin ? 'Windows needs administrator rights to change that program. Use "Run as administrator".' : r.summary, 'bad'); return false; } toast(`${list.length} program${list.length === 1 ? '' : 's'} ${enable ? 'will start with Windows again' : 'will no longer start with Windows'}.`, 'ok', async () => { await call('undo', { id: r.repairId }).catch(e => toast(e.message, 'bad')); RENDER.startup(); }); return true; };
  $$('.sw').forEach(s => s.onclick = async () => { const it = items[+s.dataset.i]; s.classList.add('busy'); const ok = await toggle([it], !it.enabled).catch(e => { toast(e.message, 'bad'); return false; }); if (ok) RENDER.startup(); else s.classList.remove('busy'); });
  $('#so').onclick = e => { const safe = items.filter(i => i.enabled && i.cls === 'SAFE_TO_DISABLE'); if (!safe.length) return toast('Nothing safe is left to stop.'); busy(e.currentTarget, 'Stopping', async () => { if (await toggle(safe, false)) RENDER.startup(); }); };
};

/* ---------- memory ---------- */
RENDER.memory = async () => {
  head(); const m = await call('memory.now'); const catT = { SYSTEM_CRITICAL: 'Windows', NEVER_AUTOCLOSE: 'Never closed' };
  $('#view').innerHTML = `<div class="page">${sum([
    { k: 'In use', v: Math.round(m.usedPercent) + '%', sub: `of ${m.totalGb} GB`, bar: m.usedPercent, barTone: m.usedPercent > 85 ? 'amber' : '' },
    { k: 'Promised to programs', v: m.commitPercent == null ? '—' : Math.round(m.commitPercent) + '%', bar: m.commitPercent || 0, barTone: m.commitPercent > 85 ? 'red' : '' }])}
    <div id="trimres"></div>
    ${panel('Using the most memory', '', '', m.top.map(t => `<div class="ctl"><div class="grow"><b>${esc(t.name)}</b></div>${catT[t.category] ? `<span class="pill na">${catT[t.category]}</span>` : ''}<div class="sz"><b>${(t.privateMb / 1024).toFixed(1)} GB</b></div></div>`).join(''))}
    ${actionbar('Nothing is closed.', `<button class="btn primary lg" id="tm">Give back idle memory</button>`)}</div>`;
  $('#tm').onclick = e => busy(e.currentTarget, 'Working', async () => { const r = await call('memory.trim'); $('#trimres').innerHTML = `<div style="margin-bottom:12px" class="note">${ic(r.reclaimedMb > 0 ? 'check' : 'info')}<div>${r.reclaimedMb > 0 ? `Memory use went from <b>${r.beforePercent}%</b> to <b>${r.afterPercent}%</b> (${r.reclaimedMb} MB given back). Nothing was closed.` : (r.failed ? 'Windows did not allow it for some programs (they may need administrator rights).' : 'Nothing idle was holding enough memory to give back.')}</div></div>`; });
};

/* ---------- history ---------- */
RENDER.activity = async () => {
  const v = await load(); drawNav(); head(); const items = v?.recent;
  if (!items) { $('#view').innerHTML = `<div class="page">${note(esc(NOSERVICE))}</div>`; return; }
  $('#view').innerHTML = `<div class="page">${panel('Activity', '', '', items.length ? `<div class="padb"><div class="tl">${items.map(i => `<div class="ev"><b style="font-weight:600">${esc(i.title)}</b><div><small>${new Date(i.at).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}${i.detail ? ' · ' + esc(i.detail) : ''}</small></div></div>`).join('')}</div></div>` : `<div class="empty">${ic('clock')}<b>Nothing yet</b></div>`)}</div>`;
};
RENDER.undo = async () => {
  head(); const hs = await call('history');
  $('#view').innerHTML = `<div class="page">${panel('Changes', '', '', hs.length ? hs.map(h => `<div class="ctl" title="${esc(h.summary || '')}"><div class="grow"><b>${esc(h.title)}</b><small>${new Date(h.at).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</small></div><button class="btn ghost sm" data-u="${esc(h.id)}">${ic('undo')}Undo</button></div>`).join('') : `<div class="empty">${ic('undo')}<b>Nothing to undo</b></div>`)}</div>`;
  $$('[data-u]').forEach(b => b.onclick = async () => { if (!(await modal('Undo this change?', 'Viro will put things back exactly as they were.', 'Undo'))) return; await busy(b, 'Undoing', async () => { const r = await call('undo', { id: b.dataset.u }); toast(r.rolledBack ? 'Undone.' : r.summary, r.rolledBack ? 'ok' : 'bad'); RENDER.undo(); }); });
};

/* ---------- Viro account ---------- */
RENDER.account = async () => {
  head(); const a = S.acct = await call('account.status');
  const rows = (keys, on) => keys.map(k => `<div class="ctl"><span class="check ${on ? 'on' : ''}">${ic(on ? 'check' : 'lock', 12)}</span><div class="grow"><b>${esc(a.titles[k] || k)}</b></div></div>`).join('');
  const paid = Object.keys(a.titles).filter(k => !a.free.includes(k));
  const has = k => a.features.includes('*') || a.features.includes(k);
  if (a.managed) { $('#view').innerHTML = `<div class="page">${note('This PC is managed by your organization, so everything is included. Your administrator decides what runs here.')}${panel('What is included', '', '', rows(paid, true))}</div>`; return; }
  if (a.signedIn) {
    $('#view').innerHTML = `<div class="page">${sum([{ k: 'Signed in as', v: esc(a.email) }, { k: 'Plan', v: esc(a.planName || 'Free'), tone: a.planName && a.active ? '' : '' }, { k: a.validUntil ? 'Paid until' : 'Status', v: a.validUntil ? new Date(a.validUntil).toLocaleDateString([], { dateStyle: 'medium' }) : 'Free plan', sub: a.stale ? 'Not checked recently: connect to the internet' : '' }])}
      ${panel('What your plan includes', 'Free features always work.', '<button class="btn ghost sm" id="rf">' + ic('refresh') + 'Check again</button><button class="btn primary sm" id="mp">Manage plan</button>', rows(paid.filter(has), true) + rows(paid.filter(k => !has(k)), false))}
      <div class="tight row"><button class="btn ghost" id="so">Sign out</button></div></div>`;
    $('#rf').onclick = e => busy(e.currentTarget, 'Checking', async () => { S.acct = await call('account.refresh'); toast('Plan checked.'); RENDER.account(); });
    $('#mp').onclick = () => call('account.manage'); $('#so').onclick = async () => { S.acct = await call('account.signout'); drawStrip(); RENDER.account(); };
    return;
  }
  $('#view').innerHTML = `<div class="page"><div class="grid">
    <div class="card page"><h2>Sign in</h2><div class="sub">Use your Viro account to unlock the plan you paid for on this PC.</div>
      <input id="em" type="email" placeholder="Email" autocomplete="username" style="margin-top:12px;width:100%;height:40px;border-radius:8px;border:0;background:var(--bg);color:#fff;padding:0 12px;font:inherit"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:8px;width:100%;height:40px;border-radius:8px;border:0;background:var(--bg);color:#fff;padding:0 12px;font:inherit">
      <input id="cd" placeholder="6-digit code (only if you use one)" style="display:none;margin-top:8px;width:100%;height:40px;border-radius:8px;border:0;background:var(--bg);color:#fff;padding:0 12px;font:inherit">
      <div class="tight row"><button class="btn primary" id="go">Sign in</button><button class="btn ghost" id="mk">Create an account</button><span class="muted" id="msg"></span></div></div>
    <div class="card page"><h2>Free</h2><div class="sub">${a.free.map(k => esc(a.titles[k] || k)).join(' · ')}</div><h2 style="margin-top:16px">Viro Care adds</h2><div class="sub">${paid.map(k => esc(a.titles[k])).join('<br>')}</div></div></div></div>`;
  $('#go').onclick = e => busy(e.currentTarget, 'Signing in', async () => {
    const r = await call('account.signin', { email: $('#em').value, password: $('#pw').value, code: $('#cd').value });
    $('#msg').textContent = r.ok ? '' : r.message; if (r.needsCode) $('#cd').style.display = '';
    if (r.ok) { S.acct = r.state; toast(r.message); drawStrip(); RENDER.account(); }
  });
  $('#mk').onclick = async () => {
    const body = `<p>For your own PC. We will email you a link to confirm your address.</p><input id="mn" placeholder="Your name" style="width:100%;height:38px;margin-top:6px;border-radius:8px;border:0;background:var(--bg);color:#fff;padding:0 10px;font:inherit"><input id="me" type="email" placeholder="Email" style="width:100%;height:38px;margin-top:6px;border-radius:8px;border:0;background:var(--bg);color:#fff;padding:0 10px;font:inherit"><input id="mp2" type="password" placeholder="Password (10 or more characters)" style="width:100%;height:38px;margin-top:6px;border-radius:8px;border:0;background:var(--bg);color:#fff;padding:0 10px;font:inherit">`;
    if (!(await modal('Create a Viro account', body, 'Create account'))) return;
    const r = await call('account.signup', { name: $('#mn')?.value || '', email: $('#me')?.value || '', password: $('#mp2')?.value || '' }).catch(x => ({ ok: false, message: x.message }));
    toast(r.message, r.ok ? 'ok' : 'bad');
  };
};

/* ---------- start ---------- */
(async () => {
  S.env = await call('env').catch(() => ({ admin: false, machine: '' }));
  call('account.status').then(a => { S.acct = a; drawStrip(); }).catch(() => { });
  call('sys').then(s => { S.sys = s; drawStrip(); }).catch(() => { /* the strip simply shows less */ });
  const start = (window.__start && RENDER[window.__start]) ? window.__start : 'overview'; drawNav();
  await go(start);
  if (S.page !== 'overview') load().then(drawNav);
})();

</script>
</body>
</html>
